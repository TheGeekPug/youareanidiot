<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are an idiot! (dot cc)</title>
    <link rel="icon" type="image/jpeg" href="thegeekpug.jpg">
    
    <!-- Meta descripción -->
    <meta name="description" content="This is the orgional and the best flash video on the 'net. Once found on www.youdontknowwhoiam.org, not found where it belong, right here on...">
    
    <!-- Meta etiqueta de Autor -->
    <meta name="author" content="TheGeekPug">

    <!-- Más información / Palabras clave solicitadas -->
    <meta name="keywords" content="TheGeekPug">

    <style>
        body {
            background-color: #ffffff;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: default; /* El mouse mantiene la flecha normal */
            user-select: none;
            -webkit-user-select: none;
        }

        #boton-audio {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 40px;
            cursor: default; /* Quita la mano también del altavoz */
            background: none;
            border: none;
            z-index: 100;
            padding: 0;
        }

        .gif-centro {
            display: block;
            height: 100vh;
            width: auto;
            max-width: 100vw;
            object-fit: contain;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <button id="boton-audio" onclick="event.stopPropagation(); toggleAudio();">🔈</button>
    
    <audio id="audio-idiot" src="you-are-an-idiot.mp3" loop></audio>
    <img src="idiot.gif" alt="You are an idiot" class="gif-centro" draggable="false" oncontextmenu="return false;">

    <script>
        const audio = document.getElementById('audio-idiot');
        const botonAudio = document.getElementById('boton-audio');

        function toggleAudio() {
            if (audio.paused) {
                audio.play()
                    .then(() => { botonAudio.textContent = '🔊'; })
                    .catch(e => console.log("Interacción requerida"));
            } else {
                audio.pause();
                audio.currentTime = 0; 
                botonAudio.textContent = '🔈';
            }
        }

        document.body.addEventListener('click', () => {
            if (audio.paused) {
                audio.play()
                    .then(() => { botonAudio.textContent = '🔊'; })
                    .catch(e => console.log("Interacción requerida"));
            }

            const popup = window.open('popup.html', '_blank', 'width=350,height=300');
            
            if (popup) {
                popup.opener = null; 
            } else {
                alert("Por favor, permite las ventanas emergentes para habilitar el efecto.");
            }
        });

        // --- BLOQUEO DE INSPECCIÓN ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && (e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C') || e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
                return false;
            }
        });

        // --- ALERTA AL CERRAR ---
        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            e.returnValue = '¿Estás seguro de que quieres salir?';
        });
    </script>
</body>
</html>
