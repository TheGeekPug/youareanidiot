<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Título del home exacto con signos y paréntesis -->
    <title>You are an idiot! (dot cc)</title>
    
    <!-- Firmas de TheGeekPug -->
    <meta name="author" content="TheGeekPug">
    <meta name="keywords" content="TheGeekPug">
    <meta name="description" content="This is the orgional and the best flash video on the 'net. Once found on www.youdontknowwhoiam.org, not found where it belong, right here on ...vThis is the orgional and the best flash video on the 'net. Once found on www.youdontknowwhoiam.org, not found where it belong, right here on ...v">

    <!-- Favicon del Home apuntando a thegeekpug.jpg -->
    <link rel="icon" type="image/jpeg" href="thegeekpug.jpg">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
        }

        .control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            display: inline-flex;
            align-items: center;
            z-index: 100;
        }

        #youare-micon {
            font-size: 40px;
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            cursor: default;
        }

        .idiot-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .idiot-container img {
            height: 100vh;
            width: auto;
            max-width: 100vw;
            object-fit: contain;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <button id="youare-micon" onclick="event.stopPropagation(); toggleAudio();">🔈</button>
    </div>

    <div class="idiot-container">
        <audio id="audio-idiot" src="you-are-an-idiot.mp3" loop></audio>
        <!-- Estrictamente apuntando a tu archivo idiot.gif centrado verticalmente -->
        <img src="idiot.gif" alt="You Are An Idiot" draggable="false" oncontextmenu="return false;">
    </div>

    <script>
        const audio = document.getElementById('audio-idiot');
        const micon = document.getElementById('youare-micon');

        function toggleAudio() {
            if (audio.paused) {
                audio.play()
                    .then(() => { micon.textContent = '🔊'; })
                    .catch(e => console.log(e));
            } else {
                audio.pause();
                audio.currentTime = 0; 
                micon.textContent = '🔈';
            }
        }

        document.body.addEventListener('click', () => {
            if (audio.paused) {
                audio.play()
                    .then(() => { micon.textContent = '🔊'; })
                    .catch(e => console.log(e));
            }

            // Abre popup.html de forma autónoma e independiente
            const popup = window.open('popup.html', '_blank', 'width=357,height=330');
            if (popup) {
                popup.opener = null;
            }
        });

        // --- ADVERTENCIA AL CERRAR ---
        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            e.returnValue = 'Are you an idiot?';
        });

        // --- BLOQUEO DE INSPECCIÓN ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && (e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C') || e.key === 'u' || e.key === 'U'))) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
