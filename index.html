<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <!-- Icono sincronizado para la pestaña del Home -->
    <link rel="icon" type="image/png" href="youareanidiot.png">
    <title>You are an idiot! (dot cc)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fff; overflow: hidden; height: 100vh; width: 100vw; cursor: default; user-select: none; display: flex; justify-content: center; align-items: center; position: relative; }
        .speaker-btn { position: absolute; top: 20px; left: 20px; font-size: 35px; background: none; border: none; cursor: default; z-index: 10000; }
        .main-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 0; }
        img { max-width: 100%; height: 100vh; object-fit: contain; display: block; }
    </style>
</head>
<body>

    <button id="speaker-button" class="speaker-btn">🔇</button>

    <div class="main-container">
        <img id="home-gif" src="You_Are_An_Idiot_screen.gif" alt="Idiot!">
    </div>

    <audio id="bg-audio" src="you-are-an-idiot.mp3" loop preload="auto"></audio>

    <script>
        const audio = document.getElementById('bg-audio'), homeGif = document.getElementById('home-gif');
        const speakerBtn = document.getElementById('speaker-button');
        const popups = [], P_WD = 400, P_HT = 300;

        // Frena el cierre involuntario mostrando el cartel nativo en el Home
        window.addEventListener('beforeunload', (event) => {
            const message = "quieres salir del sitio web";
            event.preventDefault();
            event.returnValue = message; 
            return message;
        });

        function playHomeAudio() {
            if (audio.paused) {
                audio.load();
                audio.play()
                    .then(() => { speakerBtn.textContent = "🔊"; })
                    .catch(err => console.log("Audio retenido por el navegador:", err));
            }
        }

        speakerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.paused) {
                playHomeAudio();
            } else {
                audio.pause();
                speakerBtn.textContent = "🔇";
            }
        });

        let isRealClick = false;
        window.addEventListener('mousedown', (e) => {
            if (e.target !== speakerBtn) {
                isRealClick = true;
            }
        });

        window.addEventListener('click', (e) => {
            if (!isRealClick) return;
            isRealClick = false; 

            playHomeAudio();
            
            const scrW = window.screen.availWidth, scrH = window.screen.availHeight;
            let pX = Math.max(0, Math.floor(Math.random() * (scrW - P_WD))), pY = Math.max(0, Math.floor(Math.random() * (scrH - P_HT)));
            let spX = (Math.random() > 0.5 ? 28 : -28) * (Math.random() * 1.2 + 0.8), spY = (Math.random() > 0.5 ? 28 : -28) * (Math.random() * 1.2 + 0.8);

            const win = window.open('', `_blank_${Math.random().toString(36).substring(2,9)}`, `width=${P_WD},height=${P_HT},left=${pX},top=${pY},toolbar=0,scrollbars=0,status=0,resizable=1,popup=true`);
            if (win) {
                // Genera la ruta absoluta del favicon para heredarla de forma idéntica en los Pop-ups
                const favUrl = window.location.origin + window.location.pathname.split('/').slice(0, -1).join('/') + '/youareanidiot.png';

                win.document.write(`
                    <html translate="no">
                    <head>
                        <meta charset="UTF-8">
                        <meta name="google" content="notranslate">
                        <!-- Icono sincronizado idéntico al del home -->
                        <link rel="icon" type="image/png" href="${favUrl}">
                        <title>Hi!</title>
                        <style>
                            *{margin:0;padding:0;}
                            body{background:#fff;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;cursor:default;user-select:none;}
                            div{padding:20px;height:100%;width:100%;display:flex;justify-content:center;align-items:center;}
                            img{max-width:100%;max-height:100%;object-fit:contain;}
                        </style>
                    </head>
                    <body>
                        <div><img src="${homeGif.src}"></div>
                        <audio id="pa" src="${audio.src}" loop preload="auto"></audio>
                        <script>
                            const p = document.getElementById('pa');
                            window.addEventListener('click', () => {
                                p.play().catch(err => console.log("Audio bloqueado:", err));
                            });
                        <\/script>
                    </body>
                    </html>
                `);
                win.document.close();
                popups.push({ win, pX, pY, spX, spY });
            }
        });

        window.addEventListener('blur', () => {
            isRealClick = false;
        });

        function update() {
            const scrW = window.screen.availWidth, scrH = window.screen.availHeight;
            for (let i = popups.length - 1; i >= 0; i--) {
                const p = popups[i];
                if (p.win.closed) { 
                    popups.splice(i, 1); 
                    continue; 
                }
                p.pX += p.spX; p.pY += p.spY;
                if (p.pX <= 0 || p.pX + P_WD >= scrW) p.spX = -p.spX;
                if (p.pY <= 0 || p.pY + P_HT >= scrH) p.spY = -p.spY;
                p.win.moveTo(p.pX, p.pY);
            }
            requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
    </script>
</body>
</html>
