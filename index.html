<!DOCTYPE html>
<html lang="es" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    
    <title>You are an Idiot! (dot cc)</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:"Times New Roman",serif; background:#fff; color:#000; user-select:none; display:flex; justify-content:center; align-items:center; cursor:pointer; }
        
        .audio-icon { position:absolute; top:15px; left:15px; width:32px; height:32px; cursor:pointer; z-index:99; }
        .audio-icon svg { width:100%; height:100%; fill:#000; }
        
        #box { display:flex; flex-direction:column; align-items:center; text-align:center; justify-content:center; height:100vh; aspect-ratio: 1.4 / 1; border-left:4px solid #000; border-right:4px solid #000; background:#fff; box-sizing:border-box; transition: width 0.1s, height 0.1s; }
        
        #box h1 { font-size: 6.2rem; margin:0 0 50px 0; font-weight:normal; }
        .smileys { display:flex; gap:50px; }
        .smileys svg { width:145px; height:145px; fill:none; stroke:#000; stroke-width:5; }
        .smileys circle:not([cx="50"]) { fill:#000; stroke:none; }
        
        .inv-box { background:#000 !important; color:#fff !important; border-left-color:#fff !important; border-right-color:#fff !important; }
        .inv-box .smileys svg { stroke:#fff !important; }
        .inv-box .smileys circle:not([cx="50"]) { fill:#fff !important; }
        
        .muted svg { opacity: 0.4; }
        .hidden { display: none !important; }

        .shape-original { width: 440px !important; height: 260px !important; aspect-ratio: auto !important; border: 4px solid #000; }
        .shape-square { width: 340px !important; height: 340px !important; aspect-ratio: auto !important; border: 4px solid #000; }
    </style>
</head>
<body id="b" onclick="handleInteraction(event)">
    
    <div class="audio-icon" id="spk" onclick="toggleMute(event)">
        <svg viewBox="0 0 24 24" id="spk-icon">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
    </div>
    
    <div id="box">
        <h1>you are an idiot</h1>
        <div class="smileys">
            <script>
                const smileySVG = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/><circle cx="35" cy="40" r="5"/><circle cx="65" cy="40" r="5"/><path d="M 30 60 A 20 20 0 0 0 70 60" stroke-linecap="round"/></svg>`;
                document.write(smileySVG + smileySVG + smileySVG);
            </script>
        </div>
    </div>

    <script>
        const box = document.getElementById('box'), spk = document.getElementById('spk'), icon = document.getElementById('spk-icon');
        const urlParams = new URLSearchParams(window.location.search);
        const isPopup = urlParams.get('child') === 'true';
        
        let inv = false, isMuted = false, ctx, soundAllowed = !isPopup;
        let isSquareShape = false; 

        window.addEventListener('load', () => { 
            if (isPopup) {
                document.title = "Hi!";
                spk.classList.add('hidden');
                
                box.classList.add('shape-original');
                document.querySelector('h1').style.fontSize = '2.4rem';
                document.querySelector('h1').style.margin = '0 0 20px 0';
                document.querySelectorAll('.smileys svg').forEach(svg => {
                    svg.style.width = '65px';
                    svg.style.height = '65px';
                });
                document.querySelector('.smileys').style.gap = '20px';
                
                iniciarReboteEscritorio();
            } else {
                // CORREGIDO: Activar alerta anti-cierre únicamente en la pestaña del Home
                window.addEventListener('beforeunload', alertarSalida);
            }
            run(); 
        });

        // CORREGIDO: Lógica nativa para frenar el cierre de la pestaña principal
        function alertarSalida(e) {
            // Nota: Aunque asignamos la frase, los navegadores modernos mostrarán su propia alerta genérica por seguridad
            const mensaje = "Realmente quieres salir de este sitio web";
            e.preventDefault();
            e.returnValue = mensaje; 
            return mensaje;
        }

        function handleInteraction(e) {
            if (isPopup) {
                soundAllowed = true;
                if (ctx && ctx.state === 'suspended') ctx.resume();
                return;
            }
            pop(e);
        }

        function pop(e) { 
            if (e && e.target.closest('#spk')) return;

            const w = 480;
            const h = 320;
            const left = Math.random() * (screen.width - w);
            const top = Math.random() * (screen.height - h);
            
            window.open(window.location.pathname + '?child=true', '_blank', `width=${w},height=${h},left=${left},top=${top},menubar=no,status=no,toolbar=no,scrollbars=no,resizable=yes`); 
        }
        
        function iniciarReboteEscritorio() {
            let velX = (Math.random() > 0.5 ? 1 : -1) * (11 + Math.random() * 4);
            let velY = (Math.random() > 0.5 ? 1 : -1) * (11 + Math.random() * 4);
            
            setInterval(() => {
                window.moveBy(velX, velY);
                let colisiono = false;

                if (window.screenX <= 0 || window.screenX + window.outerWidth >= screen.availWidth) {
                    velX = -velX;
                    colisiono = true;
                }
                if (window.screenY <= 0 || window.screenY + window.outerHeight >= screen.availHeight) {
                    velY = -velY;
                    colisiono = true;
                }

                if (colisiono) {
                    isSquareShape = !isSquareShape;
                    if (isSquareShape) {
                        box.classList.remove('shape-original');
                        box.classList.add('shape-square');
                        window.resizeTo(380, 400); 
                    } else {
                        box.classList.remove('shape-square');
                        box.classList.add('shape-original');
                        window.resizeTo(480, 320); 
                    }
                }
            }, 16); 
        }

        function toggleMute(e) {
            if (e) e.stopPropagation(); 
            isMuted = !isMuted;
            if (isMuted) {
                spk.classList.add('muted');
                icon.innerHTML = `<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>`;
            } else {
                spk.classList.remove('muted');
                icon.innerHTML = `<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>`;
                if (ctx && ctx.state === 'suspended') ctx.resume();
            }
        }

        function beep() {
            if (isMuted || !soundAllowed) return; 
            try {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = 'square'; 
                osc.frequency.setValueAtTime(800, ctx.currentTime); 
                gain.gain.setValueAtTime(0.08, ctx.currentTime); 
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); 
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12); 
                osc.stop(ctx.currentTime + 0.12);
            } catch(e) {}
        }

        function run() { 
            setInterval(() => { 
                box.className = inv ? box.className.replace('inv-box', '') : box.className + ' inv-box'; 
                inv = !inv;
                beep(); 
            }, 666); 
        }
    </script>
</body>
</html>
